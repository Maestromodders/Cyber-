<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ CYBER-X Bot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #00ffff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00ffff, #0080ff, #8000ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5rem;
      animation: pulse 2s infinite;
    }
    .tagline { color: #00ffff88; font-size: 1rem; margin: 1rem 0 2rem; letter-spacing: 0.3rem; }
    .card {
      background: rgba(0,255,255,0.05);
      border: 1px solid rgba(0,255,255,0.2);
      border-radius: 12px;
      padding: 2rem 3rem;
      min-width: 320px;
    }
    .row { display:flex; justify-content:space-between; padding:.5rem 0; border-bottom:1px solid rgba(0,255,255,0.1); }
    .row:last-child { border:none; }
    .lbl { color:#00ffff88; font-size:.85rem; }
    .val { color:#00ffff; font-weight:bold; }
    .dot { display:inline-block; width:10px; height:10px; background:#00ff88; border-radius:50%; margin-right:6px; animation:blink 1s infinite; }
    .footer { margin-top:2rem; color:#00ffff44; font-size:.75rem; letter-spacing:.2rem; }
    .scan { position:fixed; top:0; left:0; width:100%; height:3px; background:linear-gradient(90deg,transparent,#00ffff,transparent); animation:scan 3s linear infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.7} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes scan { 0%{top:-3px} 100%{top:100%} }
  </style>
</head>
<body>
  <div class="scan"></div>
  <div class="logo">⚡ CYBER-X</div>
  <div class="tagline">WhatsApp Multi-Device Bot</div>
  <div class="card">
    <div class="row"><span class="lbl">STATUS</span><span class="val"><span class="dot"></span>ONLINE</span></div>
    <div class="row"><span class="lbl">VERSION</span><span class="val">v1.0.0</span></div>
    <div class="row"><span class="lbl">PLATFORM</span><span class="val">Baileys MD</span></div>
    <div class="row"><span class="lbl">UPTIME</span><span class="val" id="up">00:00:00</span></div>
  </div>
  <div class="footer">// CYBER-X BOT — ACCESS GRANTED //</div>
  <script>
    const s = Date.now();
    setInterval(() => {
      const t = Math.floor((Date.now()-s)/1000);
      const h = Math.floor(t/3600), m = Math.floor((t%3600)/60), sec = t%60;
      document.getElementById('up').textContent =
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }, 1000);
  </script>
</body>
</html>
